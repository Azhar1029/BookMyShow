spring.application.name=BMS2


spring.datasource.url=jdbc:mysql://localhost:3306/BMS?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${mysql_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=booking:com.cfs.BMS2.entity.BookingNotification

app.kafka.topic=show-booking-notification

# How long a booking can sit in PENDING_PAYMENT before the scheduled job
# (BookingService.expireStalePendingBookings) auto-cancels it and frees the seats.
app.booking.pending-timeout-minutes=15

#JWT config
jwt.secret = nzjgn6KkUK_Y3hhN-D5t6hCzdfd9v-6qS4CwCUolzfHchGXRYPYfB9JrhcsXc_Rqv1xW0ooLq2jwV3DTB4Qwng
jwt.expiration = 86400000

# Razorpay API Credentials
app.razorpay.api.key-id=${razorpay_key_id}
app.razorpay.api.key-secret=${razorpay_key_secret}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${gmail_username}
spring.mail.password=${gmail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.enabled=true
app.mail.from=${spring.mail.username}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.cfs.BMS2.entity.BookingNotification

app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*